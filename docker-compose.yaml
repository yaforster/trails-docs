services:
  trails-docs:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "${TRAILS_DOCS_HOST_BIND:-127.0.0.1}:${TRAILS_DOCS_HOST_PORT:-8811}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run docs:dev -- --host 0.0.0.0"
    networks:
      - default
      - trails-public

networks:
  trails-public:
    name: trails-public
    external: true
