site_name: Trails Documentation
repo_url: https://codeberg.org/yaforster/trails-docs
repo_name: yaforster/trails-docs

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - navigation.tracking
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.share
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/repositories.css

nav:
  - Home: index.md
  - Repositories: repositories.md
  - Architecture:
      - "1. Introduction and Goals": arc42/01-introduction-goals.md
      - "2. Constraints": arc42/02-constraints.md
      - "3. Context and Scope": arc42/03-context-scope.md
      - "4. Solution Strategy": arc42/04-solution-strategy.md
      - "5. Building Block View": arc42/05-building-block-view.md
      - "6. Runtime View": arc42/06-runtime-view.md
      - "7. Deployment View": arc42/07-deployment-view.md
      - "8. Crosscutting Concepts": arc42/08-crosscutting-concepts.md
      - "9. Architecture Decisions": arc42/09-architecture-decisions.md
      - "10. Quality Requirements": arc42/10-quality-requirements.md
      - "11. Risks and Technical Debt": arc42/11-risks-technical-debt.md
      - "12. Glossary": arc42/12-glossary.md
  - ADRs:
      - "0001. Use Established Core Technologies": adr/0001-use-established-core-implementation-technologies.md
      - "0002. Store Screenshots and Downloads": adr/0002-store-screenshots-and-downloads.md
      - "0003. Use OpenAPI as API Contract": adr/0003-use-openapi-as-api-contract.md
      - "0004. Use MySQL and Liquibase": adr/0004-use-mysql-and-liquibase.md
      - "0005. Use Docker Compose": adr/0005-use-docker-compose-for-local-orchestration.md
      - "0006. Use Keycloak": adr/0006-use-keycloak-for-local-oauth2-scenarios.md
      - "0007. Use MkDocs Material": adr/0007-use-mkdocs-material-arc42-and-adrs.md
      - "0008. Build Trails Scout as Extension": adr/0008-build-trails-scout-as-browser-extension.md
      - "0009. Use Spring Boot": adr/0009-use-spring-boot-for-backend-service.md
      - "0010. Use Angular": adr/0010-use-angular-for-frontend.md
      - "0011. Use Selenium Grid": adr/0011-use-selenium-grid-for-browser-automation.md
  - Dev Guide:
      - Overview: dev-guide/index.md
      - Trails Service: dev-guide/trails-service.md
      - Trails Frontend: dev-guide/trails-frontend.md
      - Trails Scout: dev-guide/trails-scout.md
      - Trails Docs: dev-guide/trails-docs.md
